name: PR Code Quality

# Also runs on main so the caches the PR runs restore from exist there: a PR can read main's
# caches but never save one that another PR could use.
on:
    push:
        branches: [main]
        paths: &quality-paths
            - "**/*.cs"
            - "**/*.csproj"
            - "**/*.props"
            - "**/*.targets"
            - "**/*.slnx"
            - ".editorconfig"
            - "global.json"
            - "nuget.config"
            - ".github/workflows/pr-quality.yml"
            - ".github/actions/**"
            - "tools/**"
            - "GameContents/**"
    pull_request:
        branches: [main]
        paths: *quality-paths

permissions:
    contents: read

jobs:
    code-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - uses: ./.github/actions/setup-dotnet

            # The solution includes ContreJourDX.Browser, which targets net10.0-browser and cannot restore or build
            # without this workload.
            - name: Install WebAssembly workload
              run: dotnet workload install wasm-tools

            - name: Restore dependencies
              run: dotnet restore ContreJourDX.slnx

            - name: Check formatting
              run: dotnet format ContreJourDX.slnx --verify-no-changes --verbosity diagnostic

            # The level regression harness (src/ContreJourDX.Regression) runs locally rather than here:
            # its outputs are only comparable on the same machine.
            - name: Build
              run: dotnet build ContreJourDX.slnx --no-restore -c Release

            - name: Test engine
              run: dotnet test --project src/Mokus2D.Tests/Mokus2D.Tests.csproj --no-build -c Release

            - name: Test
              run: dotnet test --project src/Mokus2D.Rendering.Skia.Tests/Mokus2D.Rendering.Skia.Tests.csproj --no-build -c Release

            - name: Test desktop platform
              run: dotnet test --project src/ContreJourDX.Desktop.Platform.Tests/ContreJourDX.Desktop.Platform.Tests.csproj --no-build -c Release

            - name: Test browser platform
              run: dotnet test --project src/ContreJourDX.Browser.Platform.Tests/ContreJourDX.Browser.Platform.Tests.csproj --no-build -c Release

            - name: Test game
              run: dotnet test --project src/ContreJourDX.Tests/ContreJourDX.Tests.csproj --no-build -c Release

    # The web content pipeline and the browser publish script carry their own tests.
    python-quality:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
                  cache: pip
                  cache-dependency-path: tools/requirements.txt

            - name: Install dependencies
              run: pip install -r tools/requirements.txt

            - name: Test
              run: python -m pytest tools/webcontent/tests -q
