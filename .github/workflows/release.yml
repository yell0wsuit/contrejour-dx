name: Release

on:
    push:
        tags: ["v*"]
    workflow_dispatch:
        inputs:
            version:
                description: "Version to build, e.g. 1.0.0"
                required: true
                type: string
    # The prerelease workflow builds through this one, so both publish the same bundles.
    workflow_call:
        inputs:
            version:
                description: "Version to build, e.g. 1.0.0-prerelease+57"
                required: true
                type: string

permissions:
    contents: read

jobs:
    version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.resolve.outputs.version }}
            prerelease: ${{ steps.resolve.outputs.prerelease }}
        steps:
            # Tag pushes carry a leading "v" the scripts must not receive; dispatch and
            # called runs supply the bare version already. Releases are X.Y.Z; a CI
            # prerelease is X.Y.Z-prerelease+<run number>.
            - id: resolve
              env:
                  INPUT_VERSION: ${{ inputs.version }}
              run: |
                  if [ -n "$INPUT_VERSION" ]; then
                      version="$INPUT_VERSION"
                  else
                      version="${GITHUB_REF_NAME#v}"
                  fi
                  if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-prerelease\+[0-9]+)?$'; then
                      echo "::error::'$version' is not X.Y.Z or X.Y.Z-prerelease+N"
                      exit 1
                  fi
                  case "$version" in
                      *-prerelease*) prerelease=true ;;
                      *) prerelease=false ;;
                  esac
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

    windows:
        needs: version
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-dotnet

            - run: python distribution/release_windows.py "${{ needs.version.outputs.version }}"

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-windows
                  path: src/ContreJour.Desktop/bin/release_github/*.7z
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 7

    macos:
        needs: version
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-dotnet

            - name: Build macOS DMG
              env:
                  USE_AOT: "true"
              run: ./distribution/bundle_macos.sh "${{ needs.version.outputs.version }}"

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-macos
                  path: src/ContreJour.Desktop/bin/release_github/*.dmg
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 7

    linux:
        needs: version
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup-dotnet

            - run: ./distribution/build_appimage.sh "${{ needs.version.outputs.version }}"

            - uses: actions/upload-artifact@v7
              with:
                  name: bundle-linux
                  path: src/ContreJour.Desktop/bin/release_github/*.AppImage
                  if-no-files-found: error
                  compression-level: 0
                  retention-days: 7

    release:
        needs: [version, windows, macos, linux]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v8
              with:
                  pattern: bundle-*
                  path: artifacts
                  merge-multiple: true

            - uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ needs.version.outputs.version }}
                  name: v${{ needs.version.outputs.version }}
                  # A dispatched or prerelease run has no tag yet; pin the one it creates to
                  # the commit that was built rather than the default branch's head.
                  target_commitish: ${{ github.sha }}
                  prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
                  make_latest: ${{ needs.version.outputs.prerelease == 'true' && 'false' || 'true' }}
                  files: artifacts/*
                  generate_release_notes: true
